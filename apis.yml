  Melbourne, Australia. BHP does not publish a public developer portal;
  integration is delivered through enterprise procurement systems for tier-1
  and tier-2 suppliers, charter and shipping data exchanges for commodity
  logistics, and standard commodity-trading and assay data exchange formats
  with customers and exchanges (LME, SHFE).
